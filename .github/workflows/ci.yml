name: CI

# Every gate below is BLOCKING. Nothing here is `continue-on-error`.
#
# Toolchain versions are pinned explicitly. The Go version is never hardcoded:
# it comes from go.mod via `go-version-file: go.mod`, and the `release-config`
# job fails if any workflow, the Dockerfile, or .goreleaser.yaml disagrees with
# go.mod (that drift — '1.21','1.22' vs `go 1.26.1` — is what made the old CI
# green while the image could not build).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_VERSION: v2.9.0
  GORELEASER_VERSION: v2.9.0
  GOVULNCHECK_VERSION: v1.8.0
  ACTIONLINT_VERSION: v1.7.11
  SYFT_VERSION: v1.9.0
  TRIVY_VERSION: v0.75.0
  COVERAGE_MIN: "80"
  # Floor for each package that actually ships. Keep this list equal to the
  # binaries in .goreleaser.yaml's build target: a package in cmd/ that is not
  # listed here is a package nobody promised to test.
  COVERAGE_PKG_MIN: "60"
  SHIPPED_PKGS: "./cmd/loopworker,./cmd/loopctl"

jobs:
  # ---------------------------------------------------------------- lint/flow
  workflow-lint:
    name: Workflow & release-config lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: actionlint (catches broken workflows before they run)
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          actionlint -color .github/workflows/*.yml
      - name: YAML parse check (.goreleaser.yaml, .golangci.yaml)
        run: |
          python3 - <<'PY'
          import sys, glob
          try:
              import yaml
          except ImportError:
              # Say so instead of exiting quietly. A step that prints nothing
              # and passes reads as "the YAML was checked"; whether PyYAML is
              # preinstalled on the runner image is not this repository's
              # decision to leave to a runner release note. The three files are
              # validated for real by the steps around it -- actionlint parses
              # every workflow, `goreleaser check` parses .goreleaser.yaml, and
              # golangci-lint refuses to start on a broken .golangci.yaml --
              # so this is a redundant early signal, not the only one.
              print("::warning::PyYAML not installed; skipping the redundant YAML parse check")
              sys.exit(0)
          for f in glob.glob('.goreleaser.yaml') + glob.glob('.golangci.yaml') + glob.glob('.github/workflows/*.yml'):
              with open(f) as fh:
                  yaml.safe_load(fh)
              print('yaml ok:', f)
          PY

  release-config:
    name: Release pipeline consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: relcheck (go.mod vs Dockerfile vs workflows vs ldflags vs embeds)
        working-directory: .release/tools
        run: go run ./relcheck -root ../..
      # relcheck gates the release pipeline, so its own parser is tested: it once
      # reported three false-positive ERRORs against a correct Dockerfile, which
      # would have left this gate permanently red and therefore ignored.
      - name: relcheck self-test
        working-directory: .release/tools
        run: go test ./... -count=1
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check

  dco:
    name: DCO sign-off (every commit must be certified)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by:.+'; then
              echo "::error::commit ${sha} ($(git show -s --format='%h %an' "$sha")) has no 'Signed-off-by:' trailer"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            cat <<'EOF'
          Each commit must be signed off (Developer Certificate of Origin 1.1),
          which is what keeps future relicensing of an enterprise layer clean.
          Fix with:
            git commit --amend --signoff      # for the last commit
            git rebase --signoff "$BASE"     # for a whole branch
            git -c log.showSignature=false push --force-with-lease
          Or ask a maintainer to add the 'skip-dco' label (one-time, recorded).
          EOF
            exit 1
          fi
          echo "DCO: all commits carry Signed-off-by"
      - if: failure()
        run: echo "::warning::See CONTRIBUTING.md 'Developer Certificate of Origin'."

  # --------------------------------------------------------------------- quality
  quality:
    name: Format, vet, lint, vulns (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt (blocking — unformatted code fails the build)
        run: |
          bad=$(gofmt -l . | grep -vE '^(tmp-audit|dist)/' || true)
          if [ -n "$bad" ]; then
            echo "::error::these files are not gofmt-clean"
            echo "$bad"
            echo "Run: gofmt -w ."
            exit 1
          fi
          echo "gofmt: clean"

      - name: go vet
        run: go vet ./...

      - name: golangci-lint ${{ env.GOLANGCI_VERSION }}
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_VERSION}"
          "$(go env GOPATH)/bin/golangci-lint" run --timeout 10m ./...

      - name: govulncheck ${{ env.GOVULNCHECK_VERSION }} (known CVEs in deps + stdlib)
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" --show=verbose ./...

  test:
    name: Test (${{ matrix.os }}, go from go.mod)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # OS matrix, not a Go-version matrix: go.mod pins one Go version and the
        # product ships one toolchain. Old-Go-version matrices produced a green
        # CI for a Go version nobody ships.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -count=1 ./...

  race:
    name: Race detector (ALL packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race ./...
        # Previously this job covered only internal/core, pkg/event, pkg/utils,
        # pkg/workflow — i.e. it excluded pkg/server, the package with a verified
        # data race. Now it covers everything, so it cannot hide again.
        run: go test -race -count=1 -timeout 20m ./...

  canvas:
    name: Canvas UI (lint, test, build, embed sync)
    runs-on: ubuntu-latest
    # This file used to have no frontend steps at all, which is how the canvas
    # shipped eight defects - the node cards read Go field names against a
    # lower-case JSON API, a plain-text payload was run through atob(), and the
    # live stream ignored tasks created outside the canvas - with CI green
    # throughout. pkg/api/dist is committed and pulled into the binary by
    # go:embed, so "the frontend is broken" and "the server serves stale
    # assets" were both invisible here.
    defaults:
      run:
        working-directory: web/canvas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/canvas/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Committed embed matches this build
        # A source change that is never synced into pkg/api/dist ships the old
        # canvas while every Go test stays green.
        #
        # These paths are relative to this job's working-directory (web/canvas),
        # not to the repository root. `web/canvas/dist` from here resolves to
        # web/canvas/web/canvas/dist, which does not exist, and diff then fails
        # with the misleading "pkg/api/dist is stale" message on every PR. The
        # same ../../ prefix convention is used by the coverage job below.
        run: |
          diff -r dist ../../pkg/api/dist \
            || (echo "::error::pkg/api/dist is stale — run 'npm run build' in web/canvas and sync the output into pkg/api/dist" && exit 1)

  coverage:
    name: Coverage gate (>= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test with cross-package coverage
        run: |
          go test -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - name: Enforce threshold (was previously a report with no assertion)
        working-directory: .release/tools
        run: go run ./covergate -file ../../coverage.out -min "${COVERAGE_MIN}"
      - name: Enforce per-package floor for shipped binaries
        # AGENT-COLLABORATION-SPEC.md AC-3 asks for a cmd-layer floor but nothing
        # measured it, so it stayed red for weeks with every build green. The
        # list is explicit on purpose: adding a binary to cmd/ without a floor
        # here makes this step fail, which turns "is this shippable?" into a
        # decision someone has to make rather than a number nobody reads.
        # The other four dev CLIs (loopbench, loopsim, loopdebug, loopwatch)
        # were deleted as dev-scratch tools; see .release/SCOPE-PROPOSAL.md.
        working-directory: .release/tools
        run: go run ./covergate -pkg "${{ env.SHIPPED_PKGS }}" -pkg-min "${COVERAGE_PKG_MIN}" -file ../../coverage.out
      - name: Coverage HTML artifact (informational)
        if: always()
        run: go tool cover -html=coverage.out -o coverage.html
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html

  # ----------------------------------------------------------------------- smoke
  boot-smoke:
    name: Boot smoke test (Linux binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static binary (CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/loopworker ./cmd/loopworker/
          file bin/loopworker
      - name: Boot, then require health, auth and a task that really completes
        run: bash .release/scripts/boot-smoke.sh bin/loopworker

  boot-smoke-windows:
    name: Boot smoke test (Windows .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The bug this job kills: `make build` on Windows wrote bin/loopworker with
      # no .exe, i.e. an artifact a Windows customer cannot run at all.
      - name: Build via .release/build.ps1 (produces bin\loopworker.exe)
        shell: pwsh
        run: ./.release/build.ps1 -Task build
      - name: Assert the artifact really is an .exe
        shell: pwsh
        run: |
          Get-ChildItem bin\loopworker.exe | Select-Object Name, Length
          if (-not (Test-Path bin\loopworker.exe)) { throw "bin\loopworker.exe missing" }
          if (Test-Path bin\loopworker) { throw "suffix-less bin\loopworker exists on Windows" }
      - name: Boot + health + graceful shutdown (Ctrl+Break => SIGTERM path)
        shell: pwsh
        run: ./.release/build.ps1 -Task smoke

  # ---------------------------------------------------------------------- docker
  docker:
    name: Docker build + boot/SIGTERM smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive GO_VERSION from go.mod (no drifting pins)
        id: gov
        run: |
          v=$(grep -E '^go [0-9]' go.mod | awk '{print $2}')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "go.mod Go version => $v"
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: loopworker:smoke
          build-args: |
            GO_VERSION=${{ steps.gov.outputs.version }}
            VERSION=ci-${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
      - name: Boot container, hit /api/v1/health, prove graceful SIGTERM
        run: bash .release/scripts/docker-smoke.sh loopworker:smoke 19527
      # The name states what the command does. It read "fail on CRITICAL" while
      # the command below has failed on HIGH too since the job was written, and a
      # step name that understates the gate is the same drift class this repo's
      # other checks exist to catch --ignore-unfixed is a deliberate weakening
      # (an advisory with no fixed version cannot be remediated by changing the
      # image), so it is named here rather than left to be discovered.
      - name: Trivy image scan (fail on HIGH, ignore unfixed)
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
          trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress loopworker:smoke

  # ------------------------------------------------------ attribution artifacts
  third-party-notices:
    name: Third-party license text (go-licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate notices for statically linked dependencies
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          go-licenses save ./... --save_path=THIRD-PARTY-LICENSES --force
          go-licenses report ./... > THIRD-PARTY-NOTICES.csv
          test -d THIRD-PARTY-LICENSES
          echo "### generated file count: $(find THIRD-PARTY-LICENSES -type f | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: |
            THIRD-PARTY-LICENSES/
            THIRD-PARTY-NOTICES.csv

  release-sbom:
    # `goreleaser check` validates the schema of .goreleaser.yaml and nothing
    # else: it never invokes the tools the config names. That is how
    # SYFT_FILE_METADATA_SELECTION=inputs survived — not a legal syft value,
    # rejected only by syft's PostLoad hook, so every real release would have
    # died at "cataloging artifacts" with the whole dist/ built and nothing
    # published. Nothing ran that leg: release.yml's dry run passes
    # --skip=...sbom... and the publish path has never executed (0 git tags).
    # This job runs it for real, on every push and PR.
    name: Release SBOM generation (syft, real run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install syft (invoked by the sboms block in .goreleaser.yaml)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          syft version
      - name: goreleaser release --snapshot, SBOM step enabled
        uses: goreleaser/goreleaser-action@v6
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=publish,sign
      - name: SBOM accounts for every shipped file, with a real digest
        run: |
          python3 - <<'PY'
          import glob, json, os, sys, tarfile, zipfile

          def archive_files(path):
              """Real (non-directory) members of the archive we are shipping.

              The SBOM is checked against this set rather than against syft's own
              fileTypes. Trusting fileTypes is exactly the trap: when syft cannot
              read file contents (it does not on Windows) it marks every entry
              OTHER, so a "skip directories" rule built on fileTypes skips every
              file and the all-zero-digest check below never fires.
              """
              if path.endswith(".tar.gz"):
                  with tarfile.open(path, "r:gz") as tf:
                      return {m.name.replace("\\", "/") for m in tf.getmembers() if m.isfile()}
              if path.endswith(".zip"):
                  with zipfile.ZipFile(path) as zf:
                      return {n.replace("\\", "/") for n in zf.namelist() if not n.endswith("/")}
              sys.exit("unhandled archive type: " + path)

          archives = sorted(p for p in glob.glob("dist/*")
                            if p.endswith((".tar.gz", ".zip")))
          if not archives:
              sys.exit("no archives in dist/ -- the build leg did not run")

          failed = False
          for archive in archives:
              base = os.path.basename(archive)
              sbom = archive + ".spdx.json"
              if not os.path.exists(sbom):
                  print("::error::missing SBOM for %s" % base)
                  failed = True
                  continue

              doc = json.load(open(sbom, encoding="utf-8"))
              entries = {f["fileName"].replace("\\", "/"): f for f in doc.get("files", [])}
              shipped = archive_files(archive)

              missing, zeroed = [], []
              for member in sorted(shipped):
                  entry = entries.get(member)
                  if entry is None:
                      # syft prefixes the archive's own root dir, so match on a
                      # path suffix as well.
                      entry = next((e for n, e in entries.items() if n.endswith("/" + member)), None)
                  if entry is None:
                      missing.append(member)
                      continue
                  cks = entry.get("checksums", [])
                  if not cks or any(set(c["checksumValue"]) == {"0"} for c in cks):
                      zeroed.append(member)

              if missing:
                  print("::error::%s omits %d of the %d files in %s "
                        "(e.g. %s) -- is SYFT_FILE_METADATA_SELECTION still `all`?"
                        % (os.path.basename(sbom), len(missing), len(shipped), base,
                           ", ".join(missing[:3])))
                  failed = True
              if zeroed:
                  print("::error::%s reports an all-zero digest for %d file(s) "
                        "(e.g. %s) -- syft could not read them"
                        % (os.path.basename(sbom), len(zeroed), ", ".join(zeroed[:3])))
                  failed = True
              if not missing and not zeroed:
                  print("ok: %-56s %2d/%2d shipped files, all digests real"
                        % (os.path.basename(sbom), len(shipped), len(shipped)))
          sys.exit(1 if failed else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spdx-sboms
          path: dist/*.spdx.json
