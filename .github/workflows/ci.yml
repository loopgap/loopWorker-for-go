name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build ./...

    - name: Test
      run: go test -count=1 ./...

    - name: Race Test
      run: go test -race -count=1 ./internal/core/... ./pkg/event/... ./pkg/utils/... ./pkg/workflow/...

    - name: Vet
      run: go vet ./...

    - name: Format Check
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "The following files are not formatted:"
          gofmt -l .
          exit 1
        fi

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Build Linux
      run: |
        for cmd in loopworker loopctl loopdebug loopwatch loopbench loopsim; do
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o bin/${cmd}-linux-amd64 ./cmd/${cmd}/
        done

    - name: Build Windows
      run: |
        for cmd in loopworker loopctl loopdebug loopwatch loopbench loopsim; do
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -o bin/${cmd}-windows-amd64.exe ./cmd/${cmd}/
        done

    - name: Build macOS
      run: |
        for cmd in loopworker loopctl loopdebug loopwatch loopbench loopsim; do
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -o bin/${cmd}-darwin-amd64 ./cmd/${cmd}/
        done

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: bin/

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t loopworker:${{ github.sha }} .

    - name: Test Docker Image
      run: |
        docker run --rm loopworker:${{ github.sha }} version
