# LoopWorker Configuration Example

# Server settings
server:
  port: 19527
  # Port of the loopback-only observability listener (/metrics, /runtime/stats,
  # /logs). Its host is not configurable: it stays on 127.0.0.1.
  admin_port: 19528
  # Loopback. The server refuses to serve a writable API on a public interface
  # unless a credential is configured, so "0.0.0.0" here would make the server
  # exit 1 on startup with a message about bind_address. Set it to 0.0.0.0 only
  # together with a credential (security.api_key below, or LOOPWORKER_API_KEYS).
  host: "127.0.0.1"
  read_timeout: 30s
  # 0 means no write deadline, which is what keeps the event stream
  # (/api/v1/events/live) alive. Raise it only if you never use that endpoint.
  write_timeout: 0

# Plugin settings
plugins:
  dir: "~/.loopworker/plugins"
  auto_load: true
  # Verify each wasm artifact's sha256 against the digest its plugin.json declares.
  # Default false on purpose: a manifest that declares no digest at all is also a
  # failure here, and every plugin written before the field existed declares none.
  # Turn it on once your manifests carry digests, and republish artifact + manifest together.
  verify_checksum: false

# Data settings
data:
  dir: "~/.loopworker/data"
  db_file: "loopworker.db"

# Logging
logging:
  level: "info"  # debug, info, warn, error
  format: "json" # json, text
  output: "stdout" # stdout, stderr, file

# Security
security:
  enabled: true
  auth_required: false
  api_key: ""

# Workflow settings
workflow:
  max_concurrent: 10
  timeout: 5m

# Self-healing
selfheal:
  enabled: true
  circuit_breaker:
    threshold: 5
    timeout: 30s
  retry:
    max_attempts: 3
    backoff: 1s
