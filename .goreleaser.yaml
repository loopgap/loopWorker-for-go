# LoopWorker release pipeline (goreleaser v2.x — pinned to v2.9.0 in CI).
#
# Verified locally with:
#   goreleaser check --config .goreleaser.yaml
#   goreleaser release --snapshot --clean --skip=publish,sbom,sign
#
# What this produces per release tag (vX.Y.Z):
#   loopworker-<ver>-<os>-<arch>.tar.gz  (linux/darwin, includes .exe suffix on windows via zip)
#   loopworker-<ver>-windows-amd64.zip   (correct .exe inside — see format_overrides)
#   loopworker-<ver>.deb / .rpm          (Linux package managers)
#   checksums.txt                        (sha256, one line per artifact)
#   *.spdx.json                          (SBOM via syft)
#   *.sig / *.crt                        (cosign signatures, see .release/SIGNING.md)
#
# ---------------------------------------------------------------------------
# OWNER ACTIONS REQUIRED BEFORE THE FIRST PUBLIC RELEASE (the pipeline will
# fail fast rather than publish a half-configured release — see release.yml
# job "Preflight"):
#   1. Replace every remaining owner placeholder below with confirmed values.
#      Only the legal-entity fields (nfpms vendor + maintainer) still need one.
#   2. Create the Homebrew tap repo `homebrew-tap` under that owner.
#   3. Confirm the Go module path (see .release/MODULE-PATH.md).
# ---------------------------------------------------------------------------

version: 2
dist: dist

project_name: loopworker

# Preflight before any artifact is produced.
# `go mod verify` fails the release if a dependency in the module cache was
# tampered with. Config/path consistency checks live in .release/scripts/ and
# are run by CI (not as a hook here) so that local `goreleaser release` works
# on Windows too, where .sh shebangs are not executable.
before:
  hooks:
    - go mod verify

release:
  name_template: "LoopWorker {{ .Tag }}"
  header: |
    ## LoopWorker {{ .Tag }} ({{ .Date }})

    Self-service downloads below. Each archive contains one statically linked,
    CGO-free binary for a single OS/architecture — no runtime dependencies.

    | File | Platform |
    |------|----------|
    | `loopworker-{{ .Tag }}-linux-amd64.tar.gz` | Linux x86-64 |
    | `loopworker-{{ .Tag }}-linux-arm64.tar.gz` | Linux arm64 |
    | `loopworker-{{ .Tag }}-darwin-amd64.tar.gz` | macOS Intel |
    | `loopworker-{{ .Tag }}-darwin-arm64.tar.gz` | macOS Apple silicon |
    | `loopworker-{{ .Tag }}-windows-amd64.zip` | Windows 10/11 x86-64 (`loopworker.exe`) |

    Verify before running: `shasum -a 256 -c checksums.txt`
    Container image: `ghcr.io/loopgap/loopworker/loopworker:{{ .Tag }}` (see SUPPORT.md)
  footer: |
    ## Support

    This product is self-service. See [SUPPORT.md](https://github.com/loopgap/loopworker/blob/main/SUPPORT.md)
    for the exact scope of what we do and do not help with, [SECURITY.md](https://github.com/loopgap/loopworker/blob/main/SECURITY.md)
    for vulnerability reporting, and the shipped `docs/` inside each archive.

    ## SBOM & signatures

    Every artifact has a `.spdx.json` SBOM and a cosign signature. Verify with:

    ```bash
    cosign verify-blob \
      --signature checksums.txt.sig \
      --certificate checksums.txt.pem \
      --certificate-identity-regexp 'https://github.com/loopgap/loopworker/.+' \
      --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      checksums.txt
    ```
  prerelease: auto
  draft: false
  # GitHub is the only release target; nothing is mirrored elsewhere.
  mode: replace

# ---------------------------------------------------------------------------
# Builds: one binary, five targets, CGO disabled so the artifacts are fully
# static and runnable on any matching host without a toolchain.
# NOTE: this only holds once the pure-Go sqlite driver
# (modernc.org/sqlite) replaces gorm.io/driver/sqlite (mattn/go-sqlite3).
# CI enforces that: the `release` workflow builds with CGO_ENABLED=0 and then
# runs `go version -m` + `ldd`-free verification on the linux artifact.
# ---------------------------------------------------------------------------
builds:
  - id: loopworker
    binary: loopworker
    # Import prefix MUST match `module loopworker` in go.mod.
    # Enforced by .release/scripts/check-release-config.sh (also wired into CI).
    main: ./cmd/loopworker
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X loopworker/version.Version={{ .Version }}
      - -X loopworker/version.GitCommit={{ .FullCommit }}
      - -X loopworker/version.BuildDate={{ .Date }}
    # Explicit target list: linux amd64+arm64, darwin amd64+arm64, windows amd64.
    # windows/arm64 and darwin/arm are intentionally NOT shipped (no demand
    # evidence, each extra target is another support surface).
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
    # Reproducible-ish builds: fixed module timestamp per release.
    mod_timestamp: "{{ .CommitTimestamp }}"

# ---------------------------------------------------------------------------
# Archives: exactly one artifact per platform. LICENSE/NOTICE/docs ship inside
# the archive so attribution obligations are met even when a customer only
# keeps the tarball. web/canvas is deliberately NOT included (see
# .release/SCOPE-PROPOSAL.md).
# ---------------------------------------------------------------------------
archives:
  - id: loopworker
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    ids:
      - loopworker
    formats:
      - tar.gz
    format_overrides:
      # Windows users must get a .zip containing loopworker.exe, not a tar.gz.
      - goos: windows
        formats:
          - zip
    wrap_in_directory: true
    strip_binary_directory: false
    builds_info:
      group: root
      owner: root
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md
      - SUPPORT.md
      - SECURITY.md
      - docs/QUICKSTART.md
      - docs/USAGE.md
      - docs/api/api-reference.md
      - src: config/config.example.yaml
        strip_parent: true
        info:
          mode: 0o644
      # The example plugin. QUICKSTART section 2 is the first thing a new user
      # does, and it copies this directory into ~/.loopworker/plugins. Shipping
      # the docs without it made every tarball-only install dead on arrival:
      # the instructions build ./examples/hello-plugin, which is not in the
      # archive. It is byte-identical to pkg/plugin/testdata/hello.wasm, which
      # the test suite executes in a real WASM runtime.
      - src: examples/hello-plugin/plugin.json
        info:
          mode: 0o644
      - src: examples/hello-plugin/hello.wasm
        info:
          mode: 0o644

# ---------------------------------------------------------------------------
# Linux packages (deb/rpm) so enterprises can install via their package
# manager instead of filing a "how do I install this" ticket.
# ---------------------------------------------------------------------------
nfpms:
  - id: loopworker-packages
    package_name: loopworker
    ids:
      - loopworker
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: "TODO(owner) — publishable vendor name, must be confirmed by the human owner"
    homepage: "https://github.com/loopgap/loopworker"
    maintainer: "TODO(owner) <todo-owner@example.invalid>"
    description: "LoopWorker — WASM work-loop workflow engine (server + CLI)"
    license: "MIT"
    formats:
      - deb
      - rpm
    priority: optional
    # Explicit rather than defaulted: the binary lands here at mode 0755.
    bindir: /usr/bin
    # There is deliberately NO contents entry for the binary. GoReleaser already
    # installs every matched binary into `bindir` itself; listing it by hand is
    # not merely redundant. `src` is a path/glob on the *build machine*, so
    # `src: /usr/bin/loopworker` tells nfpm to glob for a file that exists on no
    # build host, and nfpm fails - after the binaries and archives are already
    # built, leaving 0-byte .deb/.rpm in dist/. That is what this comment exists
    # to stop someone re-adding.
    contents:
      - src: config/config.example.yaml
        dst: /etc/loopworker/config.example.yaml
        file_info:
          mode: 0644
      - dst: /var/lib/loopworker
        type: dir
        file_info:
          mode: 0750
      # A package that ships a binary and no licence text is a redistribution
      # problem, not a packaging style question. Inspected rather than assumed:
      # the deb and the rpm contained exactly three entries between them — the
      # binary, the example config and the data directory — so a customer who
      # installed by package manager received no licence, no attribution and no
      # documentation, while the tarball carried all of it. Debian Policy 12.5
      # expects the copyright text under /usr/share/doc/<pkg>/copyright, and
      # rpm distributions expect the same directory; the NOTICE goes beside it
      # because it is the attribution the Apache-2.0 dependencies require.
      - src: LICENSE
        dst: /usr/share/doc/loopworker/copyright
        file_info:
          mode: 0644
      - src: NOTICE
        dst: /usr/share/doc/loopworker/NOTICE
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/loopworker/README.md
        file_info:
          mode: 0644
      - src: CHANGELOG.md
        dst: /usr/share/doc/loopworker/CHANGELOG.md
        file_info:
          mode: 0644
      - src: docs/QUICKSTART.md
        dst: /usr/share/doc/loopworker/QUICKSTART.md
        file_info:
          mode: 0644
      - src: docs/USAGE.md
        dst: /usr/share/doc/loopworker/USAGE.md
        file_info:
          mode: 0644

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
  # Archives, binaries, packages and SBOMs are all goreleaser artifacts, so they
  # are covered by this file automatically. Do not add `extra_files` globs here:
  # a glob that matches nothing fails the release, which is exactly what happened
  # when `./dist/*.spdx.json` was listed while `--skip=sbom` was in use.

sboms:
  - id: loopworker-spdx
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"
    # Record every file in the shipped archive, not just the ones syft can
    # attribute to a Go package. Measured on the linux-amd64 archive with
    # syft v1.9.0: `all` yields 19 file entries, the default
    # `owned-by-package` yields 1 (the binary alone) — LICENSE, README,
    # CHANGELOG, SECURITY, SUPPORT, NOTICE, config.example.yaml, docs/** and
    # examples/hello-plugin/** are not Go packages, so the default makes every
    # non-binary file in the release invisible to anyone auditing it. Package
    # count is 28 either way; this only widens the file inventory.
    #
    # The legal set is exactly: all | owned-by-package | none | "".
    # `inputs` — which was here before — is rejected by
    # cmd/syft/internal/options/file.go:59-63 (PostLoad). Because that is a
    # PostLoad check the failure lands at "cataloging artifacts", i.e. *after*
    # all 5 binaries, 5 archives, 2 debs and 2 rpms are already built, so a
    # real release would die ~35s in with a full dist/ and nothing published.
    # Nothing static catches this: `goreleaser check` only validates the config
    # schema (it never invokes syft), release.yml's dry run passes
    # `--skip=...sbom...`, and the publish path has never run (0 git tags).
    # The ci.yml "release-sbom" job now runs this step for real on every push
    # and PR, and also fails if any file digest comes back all-zero.
    #
    # Two syft behaviours to know when reading a generated SBOM, neither of
    # them a defect here: the root entry is syft's own extraction path
    # (/tmp/syft-archive-contents-<random>) and is a directory, so it carries
    # no content hash; and running a *local* snapshot on Windows yields all-zero
    # SHA1 for every file (reproduced on syft v1.9.0/amd64), because syft cannot
    # read file contents there. Releases are built on ubuntu-latest, where the
    # digests were verified correct.
    env:
      - SYFT_FILE_METADATA_SELECTION=all

signs:
  # Keyless cosign signing via GitHub Actions OIDC (no long-lived secrets to
  # manage = zero after-sales support burden for key rotation).
  # Requires: sigstore/cosign-installer + `id-token: write` permission.
  # The human owner must pin COSIGN_CERTURE_IDENTITY/ISSUER to their own
  # GitHub org/repo — see .release/SIGNING.md.
  - id: cosign-checksums
    cmd: cosign
    certificate: "${artifact}.pem"
    output: true
    artifacts: checksum
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"

# ---------------------------------------------------------------------------
# Homebrew tap (macOS self-service install: `brew install loopgap/tap/loopworker`)
# Requires the tap repo to exist — release.yml's "Preflight" job blocks the
# release with a human-readable error while an owner placeholder is still present,
# so this can never publish to a fictional repo.
# ---------------------------------------------------------------------------
brews:
  - name: loopworker
    ids:
      - loopworker
    repository:
      owner: "loopgap"
      name: homebrew-tap
      branch: main
      # Token used to push the formula; release.yml passes the workflow GITHUB_TOKEN.
      token: "{{ .Env.GITHUB_TOKEN }}"
    commit_author:
      name: "loopworker-ci"
      email: "ci@localhost"
    commit_msg_template: "Release formula for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/loopgap/loopworker"
    description: "Go-native WASM work-loop workflow engine with priority scheduling and self-healing"
    license: "MIT"
    dependencies: []
    install: |
      bin.install "loopworker"
    post_install: |
      # Start the server with `loopworker` (listens on :19527). No other setup required.
    test: |
      system "#{bin}/loopworker", "version"

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  use: conventional
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge"
